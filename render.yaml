services:
  # Next.js Dashboard - Web Service
  - type: web
    name: trender-dashboard
    runtime: node
    buildCommand: cd dashboard && npm install && npm run build
    startCommand: cd dashboard && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trender-db
          property: connectionString
      - key: NEXT_PUBLIC_API_URL
        value: https://trender-dashboard.onrender.com
      - key: NODE_ENV
        value: production

  # Workflow - Main Analytics Pipeline
  - type: workflow
    name: trender-wf
    runtime: python
    rootDir: workflows
    buildCommand: pip install -r requirements.txt
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trender-db
          property: connectionString
      # GitHub OAuth App credentials (one-time setup)
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_TOKEN_ENCRYPTION_KEY
        sync: false
      # Development Settings
      - key: DEV_MODE
        value: false
      - key: DEV_REPO_LIMIT
        value: 5

  # Cron Job - Daily Auth Refresh + Analysis Trigger (6 AM PST / 14:00 UTC)
  # Runs refresh_auth.py first, then triggers the workflow.
  # This is the only place GitHub OAuth tokens are refreshed.
  - type: cron
    name: trender-cron
    runtime: python
    schedule: "0 14 * * *"
    buildCommand: cd trigger && pip install -r requirements.txt
    startCommand: cd trigger && python trigger.py
    envVars:
      - key: RENDER_WORKFLOW_SLUG
        sync: false
      - key: RENDER_API_KEY
        sync: false
      # Database and OAuth credentials needed for refresh_auth.py
      - key: DATABASE_URL
        fromDatabase:
          name: trender-db
          property: connectionString
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_TOKEN_ENCRYPTION_KEY
        sync: false

# PostgreSQL Database
databases:
  - name: trender-db
    databaseName: trender
    plan: basic_256mb
